name: Refresh profile activity

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'assets/activity.svg'
      - 'assets/stack.svg'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate activity card
        run: python scripts/update_activity.py
      - name: Commit updated card as Zahran
        run: |
          git config user.name "zahran"
          git config user.email "247448853+abdalrahmanzhrn-web@users.noreply.github.com"
          git add assets/activity.svg
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
            git push --force-with-lease="refs/heads/main:$GITHUB_SHA" origin HEAD:main
          fi
